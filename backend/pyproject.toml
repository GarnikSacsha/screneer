[project]
name = "quantdesk-anomaly-backend"
version = "0.1.0"
description = "CEX-first anomaly screener backend for altcoin market monitoring."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "redis[hiredis]>=5.0.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "pyyaml>=6.0.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py310"
