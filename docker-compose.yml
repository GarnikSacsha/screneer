services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quantdesk
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quantdesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://quant:${POSTGRES_PASSWORD}@postgres:5432/quantdesk
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./index.html:/index.html:ro
      - ./app.js:/app.js:ro
      - ./styles.css:/styles.css:ro
      - ./assets:/assets:ro
      - ./latest-preview.json:/latest-preview.json

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://quant:${POSTGRES_PASSWORD}@postgres:5432/quantdesk
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.cli", "run-binance-poll", "--interval", "60"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

  liquidation-worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.cli", "run-binance-liquidations"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
